kind: workflow
name: design
phase: shape
summary: Write the design and a typed skeleton, and get it past a skeptic.
roles: [architect, skeptic]
inputs: [task, findings]
outputs: [design]
steps:
  - {id: sketch, role: architect, do: Write the design and a typed skeleton with stub bodies.}
  - {id: critique, role: skeptic, do: Review the design and approve it or ask for a revision.}
loop: {until: the skeptic approves, back_to: sketch, max: 3, on_exhaust: escalate}
