kind: workflow
schema_version: 1
name: research
phase: understand
summary: Read the code and sources until the unknowns are answered, and write the findings down.
roles: [researcher]
inputs: [task]
outputs: [findings]
steps:
  - {id: read, do: Read the code paths and primary sources for each open question.}
  - {id: write, do: Write each finding with its source.}
loop: {until: no open question blocks the plan, back_to: read, max: 3, on_exhaust: escalate}
