name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # validate-skills.py reads which names used to be skills from git
          # history, so the default shallow clone would hide stale references.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Check models.json only names models it can back
        run: python3 scripts/validate-models.py

      - name: Validate skill links and frontmatter
        run: python3 scripts/validate-skills.py plugins/pstack/skills

      - name: Run pytest
        run: pytest plugins/pstack scripts -q
