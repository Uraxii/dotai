min_version = "2026.10.25"

[tools]
python = "3.12.12"
node = "24.22.2"
jq = "1.8.1"
"aqua:rhysd/actionlint" = "1.7.11"

[tasks.test]
description = "Run plugin hook tests and Shunt evals"
run = "bash scripts/run-hook-tests.sh"

[tasks."check:manifests"]
description = "Check generated plugin files"
run = "python3 scripts/generate-plugin-manifests.py --check"

[tasks."lint:hooks"]
description = "Check hook commands and manifest references"
run = "bash scripts/lint-hook-references.sh"

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.ci]
description = "Run the deterministic repository checks (test includes hook lint)"
depends = ["test", "check:manifests", "lint:workflows"]

[tasks."smoke:claude"]
description = "Run Claude Code against a local model stub"
run = "python3 scripts/smoke-harness.py claude --npm-package @anthropic-ai/claude-code@2.1.332"

[tasks."smoke:codex"]
description = "Run Codex against a local model stub"
run = "mise exec npm:@openai/codex@0.172.0 -- python3 scripts/smoke-harness.py codex"

[tasks."smoke:copilot"]
description = "Run GitHub Copilot CLI against a local model stub"
run = "mise exec npm:@github/copilot@1.0.116 -- python3 scripts/smoke-harness.py copilot"

[tasks."smoke:devin"]
description = "Run the optional authenticated Devin CLI smoke"
run = "python3 scripts/smoke-harness.py devin"
