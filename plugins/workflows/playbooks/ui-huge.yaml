kind: playbook
schema_version: 1
name: ui-huge
summary: A UI change at 13 points, like app-wide dark mode or new navigation model.
when: {task: ui, points: [13]}
chain:
  - prototype
  - measure
  - plan
  - design
  - loop: {until: every component matches the reference, max: 20, on_exhaust: re-score, do: [build, measure]}
  - review
  - pr
  - learn
