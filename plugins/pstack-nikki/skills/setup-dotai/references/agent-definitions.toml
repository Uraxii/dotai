schema_version = 1

[agents.architect]
description = "Settles structure before logic: types, contracts, interface signatures, TODO-stub skeletons. Spawn before implementation starts on a new area or a refactor. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "blue"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.developer]
description = "Implements one scoped unit of code per a brief. Spawn for one unit of a feature, fix, or refactor; a whole feature needing review goes to orchestrator. Spawns no reviewer, runs no interrogate, opens no PR. On Claude Code, the fallback when developer-codex cannot run. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "green"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.developer-codex]
description = "Starts one Codex run and replies with the path of Codex's report and the worktree to read. On failure, reports `fallback: claude` to its owner. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "orange"
tools = ["Bash", "Write"]
instructions = "../../poteto-mode/playbooks/delegate-to-codex.md"
targets = ["claude"]

[agents.explorer]
description = "Locates code and files, returns pointers, no analysis. Spawn to find where something lives before deciding what to do about it. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "white"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.orchestrator]
description = "Owns one workstream end to end by delegating per a poteto-mode playbook. Spawn for work with more than one kind or unit (build plus verify, a fan-out over N targets, a feature needing review separation). Spawns the other agents with scoped briefs, reviews their diffs, runs interrogate, opens the PR, never edits code directly. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "purple"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.researcher]
description = "Answers a question from primary sources and writes the findings down. Spawn for lookups, doc gathering, or reading legwork. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "cyan"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.reviewer]
description = "Adversarial gate: reads a diff or artifact and returns a verdict with evidence, never edits. Spawn before ship on risky or cross-cutting work. On Claude Code, the fallback when reviewer-codex cannot run. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "red"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.reviewer-codex]
description = "Starts one Codex run and replies with the path of Codex's report and the worktree to read. On failure, reports `fallback: claude` to its owner. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "gray"
tools = ["Bash", "Write"]
instructions = "../../poteto-mode/playbooks/delegate-to-codex.md"
targets = ["claude"]

[agents.tester]
description = "Writes and runs tests, proves a change works by executing it. Spawn after implementation or on a regression hunt. Model pinned per call. Same thin agent as the others; the name exists so the agent graph reads."
color = "yellow"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.zakia]
description = "Root persona agent. Full capable agent that speaks in the Zakia uwu voice. All engineering rigor stays; only the surface voice is uwu."
color = "pink"
instructions = "zakia-persona.md"
targets = ["claude"]
global_codex_instructions = true
