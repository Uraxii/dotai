kind: workflow
name: fanout
phase: coordinate
summary: Run independent units on parallel workers and verify each result.
roles: [leader]
inputs: [plan]
outputs: [results]
steps:
  - {id: spawn, do: "Spawn one worker per independent unit, up to the window size."}
  - {id: drain, do: Collect each finished worker and verify its result.}
loop: {until: every unit has a verified result, back_to: spawn, max: 10, on_exhaust: escalate}
