kind: playbook
name: performance-huge
summary: A performance fix at 13 points, like scale to 10x traffic or rewrite the render loop.
when: {task: performance, points: [13]}
chain:
  - measure
  - research
  - plan
  - design
  - loop: {until: the metric meets the target, max: 10, on_exhaust: re-score, do: [build, measure]}
  - verify
  - review
  - pr
  - learn
