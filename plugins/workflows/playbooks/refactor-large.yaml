kind: playbook
schema_version: 1
name: refactor-large
summary: A refactor at 8 points, like new data layer for a feature or make a module async.
when: {task: refactor, points: [8]}
chain:
  - research
  - pin
  - plan
  - design
  - loop: {until: the target shape is reached, max: 10, on_exhaust: re-score, do: [build, test]}
  - verify
  - review
  - pr
