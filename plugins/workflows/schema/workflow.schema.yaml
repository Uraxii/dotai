$schema: https://json-schema.org/draft/2020-12/schema
$id: workflow.schema.yaml
title: Workflow
description: One small reusable unit of work with an optional loop. Playbooks chain workflows.
type: object
additionalProperties: false
required: [kind, schema_version, name, phase, summary, roles, steps]
properties:
  kind: {const: workflow}
  schema_version: {const: 1, description: Version of this schema the document follows. Bump it on a breaking schema change.}
  name: {$ref: "#/$defs/name"}
  phase:
    enum: [understand, prove, shape, make, check, finish, deliver, coordinate]
  summary: {type: string, minLength: 1}
  roles:
    description: Roles that can fill this workflow. Never a specific agent or model.
    type: array
    minItems: 1
    items: {$ref: "#/$defs/name"}
  inputs: {$ref: "#/$defs/artifacts"}
  outputs: {$ref: "#/$defs/artifacts"}
  steps:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, do]
      properties:
        id: {$ref: "#/$defs/name"}
        do: {type: string, minLength: 1}
        role: {$ref: "#/$defs/name"}
  loop:
    type: object
    additionalProperties: false
    required: [until, back_to, max, on_exhaust]
    properties:
      until: {type: string, minLength: 1, description: Checkable exit predicate.}
      back_to: {$ref: "#/$defs/name", description: Step id the loop returns to.}
      max: {type: integer, minimum: 1}
      on_exhaust: {enum: [escalate, re-score, split, stop]}
$defs:
  name: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
  artifacts:
    type: array
    items: {$ref: "#/$defs/name"}
