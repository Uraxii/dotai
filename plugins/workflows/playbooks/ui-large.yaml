kind: playbook
name: ui-large
summary: A UI change at 8 points, like design system components or full accessibility pass.
when: {task: ui, points: [8]}
chain:
  - measure
  - plan
  - design
  - loop: {until: every component matches the reference, max: 20, on_exhaust: re-score, do: [build, measure]}
  - review
  - pr
