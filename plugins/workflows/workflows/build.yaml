kind: workflow
schema_version: 1
name: build
phase: make
summary: Write the change and self-check it.
roles: [developer]
inputs: [plan]
outputs: [change]
steps:
  - {id: write, do: Write the code for the step.}
  - {id: self-check, do: Run local checks.}
loop: {until: local checks pass, back_to: write, max: 3, on_exhaust: escalate}
