name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # validate-skills.py reads which names used to be skills from the
          # git history of the plugin skills trees, so the default shallow
          # clone would hide stale references.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bd-backed pytest modules skip when bd is not on PATH, so without
      # this step they report green having run nothing.
      - name: Install bd
        run: scripts/install-bd.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Run the checks
        run: scripts/check
        env:
          CHECK_REQUIRE_ALL: "1"
          DOTAI_CHECK_VENV: ${{ runner.temp }}/check-venv
