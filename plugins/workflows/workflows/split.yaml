kind: workflow
name: split
phase: coordinate
summary: Split a goal that is too big into parts, each one a new ask.
roles: [planner]
inputs: [task]
outputs: [sub-tasks]
steps:
  - {id: split, do: Split the goal into parts that can ship on their own.}
  - {id: re-score, do: Score each part in Fibonacci points.}
loop: {until: every part is 13 points or less, back_to: split, max: 3, on_exhaust: escalate}
