name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Check models.json is stamped into every consuming skill
        run: python3 plugins/pstack-nikki/skills/setup-dotai/scripts/generate-models.py --check

      - name: Check generated agent configs are current
        run: python3 plugins/pstack-nikki/skills/setup-dotai/scripts/generate-agent-configs.py --check

      - name: Validate skill links and frontmatter
        run: python3 plugins/pstack-nikki/skills/setup-dotai/scripts/validate-skills.py plugins/pstack-nikki/skills

      - name: Run pytest
        run: pytest plugins/pstack-nikki -q
