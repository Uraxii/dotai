kind: workflow
schema_version: 1
name: plan
phase: shape
summary: Break the task into ordered steps with acceptance criteria.
roles: [planner]
inputs: [task]
outputs: [plan]
steps:
  - {id: tasks, do: Write the steps and their acceptance criteria.}
  - {id: order, do: Order the steps and mark what can run in parallel.}
loop: {until: every step has a checkable criterion, back_to: tasks, max: 3, on_exhaust: re-score}
