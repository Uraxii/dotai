kind: workflow
schema_version: 1
name: pr
phase: deliver
summary: Shape small ordered commits and open the pull request.
roles: [developer]
inputs: [change, verdict]
outputs: [pull-request]
steps:
  - {id: commits, do: Rebase into small ordered commits.}
  - {id: open, do: Open the PR with a why-first description.}
loop: {until: each PR is one reviewable unit, back_to: commits, max: 2, on_exhaust: split}
