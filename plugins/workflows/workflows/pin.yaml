kind: workflow
name: pin
phase: prove
summary: Lock the behavior into a test before changing code.
roles: [tester]
inputs: [task]
outputs: [pinning-test]
steps:
  - {id: write, do: Write a test for the behavior. A bug test fails first; a refactor test passes first.}
  - {id: confirm, do: Run it and confirm the expected first result.}
loop: {until: the test gives the expected first result, back_to: write, max: 3, on_exhaust: escalate}
