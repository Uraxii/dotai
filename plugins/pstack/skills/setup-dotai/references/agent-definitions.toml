schema_version = 1

[agents.architect]
description = "Spawn to settle types, contracts, and TODO-stub skeletons before implementation starts on a new area or a refactor."
color = "blue"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.developer]
description = "Spawn for one scoped implementation unit, and as the Claude Code fallback when `developer-codex` cannot run; opens no PR, spawns no reviewer."
color = "green"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.developer-codex]
description = "Default for one scoped implementation unit on Claude Code: starts a Codex run, replies with five lines pointing at the worktree it wrote."
color = "orange"
tools = ["Bash", "Write"]
instructions = "../../poteto-mode/references/codex-watcher-body.md"
targets = ["claude"]

[agents.explorer]
description = "Spawn to locate where code and files live and return pointers, before deciding what to do about them."
color = "white"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.orchestrator]
description = "Spawn for work with more than one kind or unit; it delegates, reviews, and opens the PR, never writing the implementation itself."
color = "purple"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.poteto-agent]
description = "Routing target for `/poteto-mode` and any request for poteto's style; resume an existing one rather than spawning a sibling or `general-purpose`."
color = "blue"
instructions = "poteto-agent-body.md"
targets = ["claude"]

[agents.researcher]
description = "Spawn for lookups, doc gathering, or reading legwork: answers one question from primary sources and writes the findings down."
color = "cyan"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.reviewer]
description = "Spawn as the adversarial gate before ship, and as the Claude Code fallback when `reviewer-codex` cannot run; returns a verdict, never edits."
color = "red"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.reviewer-codex]
description = "Default for one review gate on Claude Code: starts a read-only Codex run, replies with five lines pointing at the repo it read."
color = "gray"
tools = ["Bash", "Write"]
instructions = "../../poteto-mode/references/codex-watcher-body.md"
targets = ["claude"]

[agents.tester]
description = "Spawn after implementation or on a regression hunt to write and run tests that prove the change works."
color = "yellow"
instructions = "poteto-agent-body.md"
targets = ["claude", "codex"]

[agents.zakia]
description = "Spawn when the user wants the Zakia uwu voice; a fully capable agent whose engineering rigor is unchanged, only the surface voice."
color = "pink"
instructions = "zakia-persona.md"
targets = ["claude"]
global_codex_instructions = true
