kind: workflow
schema_version: 1
name: threat
phase: shape
summary: Model the threats and hand each risk to design with a mitigation.
roles: [security-auditor]
inputs: [task]
outputs: [threat-model]
steps:
  - {id: model, do: "List the assets, entry points, and attackers, and the risk each one carries."}
  - {id: hand-off, do: Give each risk a mitigation for design to carry.}
loop: {until: a full pass finds no new risk, back_to: model, max: 3, on_exhaust: escalate}
