name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # validate-skills.py reads which names used to be skills from the
          # git history of the plugin skills trees, so the default shallow
          # clone would hide stale references.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Check models.json only names models it can back
        run: python3 scripts/validate-models.py

      - name: Check the generated manifests match the generator
        run: python3 scripts/generate-plugin-manifests.py --check

      # Every tree in one run. A plugin citing a skill in another plugin only
      # shows up to a run that can see both, and a tree split out of another
      # only remembers deletions through the tree it came from.
      - name: Validate skill links and frontmatter
        run: python3 scripts/validate-skills.py plugins/*/skills

      # No paths. Naming them is how eighty tests went uncollected when the
      # skills moved out of plugins/pstack. test_ci_workflow.py keeps it that
      # way.
      - name: Run pytest
        run: pytest -q
